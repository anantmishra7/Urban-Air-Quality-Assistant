name: BreatheCity AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-quality-and-tests:
    name: Backend Tests & Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install ruff

      - name: Lint backend with ruff
        working-directory: backend
        run: ruff check . --ignore E501

      - name: Run pytest test suite
        run: python -m pytest backend/tests -v --tb=short

  frontend-quality-and-build:
    name: Frontend Build & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: TypeScript strict verification
        working-directory: frontend
        run: npx tsc --noEmit

      - name: ESLint verification
        working-directory: frontend
        run: npm run lint

      - name: Production Vite build
        working-directory: frontend
        run: npm run build
