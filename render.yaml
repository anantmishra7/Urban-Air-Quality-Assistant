services:
  - type: web
    name: breathecity-ai
    runtime: python
    plan: free
    buildCommand: |
      pip install -r backend/requirements.txt &&
      cd frontend && npm install && npm run build && cd ..
    startCommand: cd backend && python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.3"
      - key: CORS_ORIGINS
        value: "https://breathecity-ai.onrender.com,http://localhost:5173"
      - key: DATABASE_URL
        value: "sqlite:///./breathecity.db"
